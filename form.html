<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilhas PR | Inscrição</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Menu padrão: o mesmo bloco em todas as páginas, muda só o link "active" -->
  <header class="topo">
    <a href="index.html" class="marca"><img src="img/logo.svg" alt="" width="36" height="36">Trilhas PR</a>
    <nav id="menu" class="menu">
      <a href="index.html">Início</a>
      <a href="form.html" class="active">Inscrição</a>
      <a href="about.html">Sobre</a>
    </nav>
    <button type="button" class="btn-icone" id="btnTema" aria-label="Alternar tema claro/escuro">◐</button>
    <button type="button" class="btn-icone" id="btnMenu" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">☰</button>
  </header>

  <main class="conteudo">
    <h1 class="titulo">Inscrição em saída guiada</h1>
    <p class="texto-suave">Preencha todos os campos. Os dados são enviados pelo método GET para a página de confirmação.</p>

    <!-- novalidate: as regras ficam no HTML (required, type, pattern...), mas quem mostra as mensagens é o script/form.js -->
    <form id="formInscricao" class="caixa formulario" action="formAction.html" method="get" novalidate>

      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required minlength="5" maxlength="60"
               placeholder="Ex.: Ana Souza" autocomplete="name" aria-describedby="erro-nome">
        <span class="erro" id="erro-nome"></span>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required maxlength="80"
               placeholder="nome@dominio.com" autocomplete="email" aria-describedby="erro-email">
        <span class="erro" id="erro-email"></span>
      </div>

      <div class="campo">
        <label for="celular">Celular</label>
        <input type="tel" id="celular" name="celular" required maxlength="15"
               pattern="\(\d{2}\) \d{5}-\d{4}" placeholder="(41) 99999-9999" autocomplete="tel" aria-describedby="erro-celular">
        <span class="erro" id="erro-celular"></span>
      </div>

      <div class="campo">
        <label for="data">Data da trilha</label>
        <input type="date" id="data" name="data" required aria-describedby="erro-data">
        <span class="erro" id="erro-data"></span>
      </div>

      <div class="campo">
        <label for="trilha">Trilha</label>
        <select id="trilha" name="trilha" required aria-describedby="erro-trilha">
          <option value="">Selecione...</option>
          <option value="pico">Pico Paraná</option>
          <option value="anhangava">Morro do Anhangava</option>
          <option value="itupava">Caminho do Itupava</option>
        </select>
        <span class="erro" id="erro-trilha"></span>
      </div>

      <div class="campo">
        <fieldset aria-describedby="erro-nivel">
          <legend>Nível de experiência</legend>
          <div class="opcoes">
            <label><input type="radio" name="nivel" value="iniciante" required> Iniciante</label>
            <label><input type="radio" name="nivel" value="intermediario"> Intermediário</label>
            <label><input type="radio" name="nivel" value="avancado"> Avançado</label>
          </div>
        </fieldset>
        <span class="erro" id="erro-nivel"></span>
      </div>

      <div class="campo">
        <label for="obs">Observações <span class="contador" id="contador">0/200</span></label>
        <textarea id="obs" name="obs" rows="3" maxlength="200"
                  placeholder="Restrições de saúde, dúvidas... (opcional, até 200 caracteres)" aria-describedby="erro-obs"></textarea>
        <span class="erro" id="erro-obs"></span>
      </div>

      <div class="campo">
        <label class="check"><input type="checkbox" id="termos" name="termos" value="sim" required aria-describedby="erro-termos">
          Li e concordo com as regras de segurança da trilha</label>
        <span class="erro" id="erro-termos"></span>
      </div>

      <div class="acoes">
        <button type="submit" class="btn">Enviar</button>
        <button type="reset" class="btn btn-secundario">Limpar</button>
      </div>
    </form>
  </main>

  <footer class="rodape">Trilhas PR · Atividade Somativa 1 · PUCPR</footer>

  <script src="script/menu.js"></script>
  <script src="script/form.js"></script>
</body>
</html>
